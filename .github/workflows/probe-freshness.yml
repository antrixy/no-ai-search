# .github/workflows/probe-freshness.yml
#
# docs/monitoring/heading-detection-dryrun.js copies HEADING_TEXT_PATTERNS
# and climbToPanel() verbatim from content.js, because a probe cannot test
# whether a pattern still matches without evaluating that pattern. The copy
# is correct only for one specific version of content.js.
#
# Without a guard, editing content.js leaves a plausible-looking probe in
# docs/ testing rules the extension no longer uses — silent drift, and the
# exact failure docs/inspect-hidden-panels.js was written to avoid. This
# turns that into a red check.
#
# When this fails: re-sync the verbatim block in the probe, then update
# CONTENT_JS_SHA256 to the new hash. Do not update the hash alone.

name: probe freshness

on:
  push:
    paths:
      - 'no-ai-search/content.js'
      - 'docs/monitoring/heading-detection-dryrun.js'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both probes copy logic, so both need a pin. redirect-health.js copies
      # SAFE_VERTICAL_UDM_VALUES and BYPASS_PARAM from background.js — it was
      # unguarded until now, which is the same drift this workflow exists for.
      #
      # NOTE ON WHAT THIS PROVES: change detection, not equivalence. A green
      # check means "the pin matches the source today," not "the copied block
      # is correct." Someone can edit the source and update only the pin. It is
      # a tripwire; do not read it as proof the probes are in sync.
      - name: probes are pinned to their sources
        run: |
          set -euo pipefail
          fail=0

          check_pin () {
            probe="$1"; source="$2"; var="$3"
            actual=$(sha256sum "$source" | cut -d' ' -f1)
            pinned=$(grep -oE "${var} = \"[0-9a-f]{64}\"" "$probe" \
                     | grep -oE '[0-9a-f]{64}' || true)
            if [ -z "$pinned" ]; then
              echo "::error file=$probe::No ${var} pin found."
              fail=1; return
            fi
            if [ "$actual" != "$pinned" ]; then
              echo "::error file=$probe::Stale — it copies logic from $source, which has changed."
              echo "  pinned: $pinned"
              echo "  actual: $actual"
              echo "Re-sync the verbatim block, then update the pin."
              fail=1; return
            fi
            echo "ok: $probe pinned to $source ($actual)"
          }

          check_pin docs/monitoring/heading-detection-dryrun.js \
                    no-ai-search/content.js CONTENT_JS_SHA256
          check_pin docs/monitoring/redirect-health.js \
                    no-ai-search/background.js BACKGROUND_JS_SHA256

          exit $fail

      # The shipping extension is the product; the probes are scaffolding.
      # Checking only the scaffolding had it backwards.
      - name: shipping code parses
        if: always()
        run: |
          set -euo pipefail
          for f in no-ai-search/*.js; do
            node --check "$f"
            echo "ok: $f"
          done
          python3 -c "import json,sys; json.load(open('no-ai-search/manifest.json'))"
          echo "ok: no-ai-search/manifest.json"

      - name: probes parse
        if: always()
        run: |
          set -euo pipefail
          for f in docs/monitoring/*.js docs/inspect-hidden-panels.js; do
            [ -e "$f" ] || continue
            node --check "$f"
            echo "ok: $f"
          done
